<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="shieldGrad" x1="8" y1="4" x2="40" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#D946EF"/>
    </linearGradient>
    <linearGradient id="shieldInner" x1="12" y1="8" x2="36" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#818CF8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#E879F9" stop-opacity="0.15"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Shield body -->
  <path d="M24 3L6 11v12c0 11.1 7.7 21.5 18 24 10.3-2.5 18-12.9 18-24V11L24 3z" fill="url(#shieldGrad)"/>
  <path d="M24 6L9 13v10c0 9.7 6.4 18.8 15 21 8.6-2.2 15-11.3 15-21V13L24 6z" fill="#080A16"/>
  <path d="M24 6L9 13v10c0 9.7 6.4 18.8 15 21 8.6-2.2 15-11.3 15-21V13L24 6z" fill="url(#shieldInner)"/>
  <!-- Exclamation mark (alert/detective concept) -->
  <g filter="url(#glow)">
    <rect x="21.5" y="15" width="5" height="13" rx="2.5" fill="url(#shieldGrad)"/>
    <circle cx="24" cy="34" r="3" fill="url(#shieldGrad)"/>
  </g>
</svg>
